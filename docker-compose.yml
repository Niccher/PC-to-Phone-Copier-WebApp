version: '3.8'

# Standalone Docker Compose for P2P Copier WebApp
# Usage: docker compose up --build -d
# This will spin up the webapp, MySQL, and phpMyAdmin.

services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_p2p_copier
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - shared-network

  p2p-copier:
    build:
      context: .
      dockerfile: Dockerfile
    image: p2p-copier-webapp:latest
    container_name: p2p-copier-webapp
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - shared-network

  minio:
    image: minio/minio:latest
    container_name: shared-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secure_password
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - shared-network

  minio-init:
    image: minio/mc:latest
    container_name: shared-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio_admin minio_secure_password;
      /usr/bin/mc mb --ignore-existing myminio/p2p-copier-files;
      /usr/bin/mc anonymous set download myminio/p2p-copier-files;
      exit 0;
      "
    networks:
      - shared-network

volumes:
  mysql-data:
  minio-data:

networks:
  shared-network:
    name: hosts-shared-network

